<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ROYAL WIFI - QR Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07101f,#111a35 55%,#070b16);font-family:Tahoma,Arial,sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;padding:18px}
.card{width:min(520px,100%);background:rgba(16,24,45,.96);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.45);text-align:center}
.brand{font-size:26px;font-weight:900;letter-spacing:1px;margin-bottom:6px}
.sub{color:#b8c3dc;font-size:14px;margin-bottom:18px}
#reader{width:100%;max-width:430px;margin:0 auto;overflow:hidden;border-radius:20px;background:#000;min-height:260px}
#reader video{border-radius:20px}
.status{margin:16px 0;padding:13px;border-radius:14px;background:rgba(255,255,255,.07);color:#dce5ff;font-size:14px;line-height:1.7}
button{border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ffd76a,#f3a51b);color:#17110a}
button.secondary{background:#273553;color:#fff;margin-right:8px}
.raw{display:none;text-align:right;direction:ltr;background:#090d17;border:1px solid #293652;padding:10px;border-radius:12px;word-break:break-all;font-size:12px;color:#bcd0ff}
.small{font-size:11px;color:#8995af;margin-top:14px;line-height:1.6}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="card">
  <div class="brand">༺👑 ＲＯＹＡＬ ＷＩＦＩ 👑༻</div>
  <div class="sub">تسجيل الدخول بالكارت عن طريق QR</div>

  <div id="reader"></div>
  <div id="status" class="status">اضغط «بدء الكاميرا» ثم وجّه الكاميرا إلى QR الموجود على الكارت.</div>
  <button id="start">📷 بدء الكاميرا</button>
  <button id="stop" class="secondary" style="display:none">إيقاف</button>

  <div id="raw" class="raw"></div>
  <div class="small">يتم إرسال بيانات الكارت إلى صفحة تسجيل الدخول في MikroTik بعد قراءة QR.</div>
</div>

<script>
(function(){
  const HOTSPOT = "http://1.0.0.1/login";
  const statusEl = document.getElementById("status");
  const rawEl = document.getElementById("raw");
  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");
  let scanner = null, busy = false;

  function status(t){ statusEl.textContent=t; }

  function decodeValue(v){
    try { return decodeURIComponent(v.replace(/\+/g," ")); } catch(e){ return v; }
  }

  function extractCredentials(raw){
    raw = String(raw || "").trim();
    let username="", password="", dst="";

    // URL/query/hash forms
    try{
      const u = new URL(raw);
      const p = u.searchParams;
      username = p.get("username") || p.get("user") || p.get("u") || "";
      password = p.get("password") || p.get("pass") || p.get("p") || "";
      dst = p.get("dst") || "";
    }catch(e){}

    // key=value text, JSON-like text, or plain labels
    const get = (names) => {
      for(const n of names){
        const re = new RegExp('(?:^|[?&\\s,;|{}\\[\\]"]+)' + n + '\\s*[:=]\\s*["\\']?([^"\\'&\\s,;|}\\]]+)', 'i');
        const m = raw.match(re);
        if(m) return decodeValue(m[1]);
      }
      return "";
    };

    if(!username) username=get(["username","user","login","u"]);
    if(!password) password=get(["password","pass","pwd","p"]);

    // Some scanners return JSON.
    if((!username || !password) && /^[\[{]/.test(raw)){
      try{
        const j=JSON.parse(raw);
        username=j.username || j.user || j.login || "";
        password=j.password || j.pass || j.pwd || "";
        dst=j.dst || "";
      }catch(e){}
    }

    if(username && password) return {username,password,dst,raw};
    return null;
  }

  function stop(){
    if(scanner){
      scanner.stop().catch(()=>{});
      scanner.clear().catch(()=>{});
      scanner=null;
    }
    stopBtn.style.display="none";
    startBtn.style.display="inline-block";
  }

  function login(c){
    busy=true;
    stop();
    rawEl.style.display="block";
    rawEl.textContent=c.raw;
    status("تمت قراءة QR بنجاح. جارٍ تسجيل الدخول...");

    // RouterOS HotSpot with http-pap accepts username/password POST.
    const form=document.createElement("form");
    form.method="POST";
    form.action=HOTSPOT;
    form.style.display="none";

    const fields={
      username:c.username,
      password:c.password,
      dst:c.dst || "http://1.0.0.1/",
      popup:"true"
    };
    Object.keys(fields).forEach(k=>{
      const input=document.createElement("input");
      input.type="hidden"; input.name=k; input.value=fields[k];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
  }

  async function start(){
    if(busy) return;
    status("جارٍ تشغيل الكاميرا...");
    startBtn.style.display="none";
    stopBtn.style.display="inline-block";
    scanner = new Html5Qrcode("reader");
    try{
      await scanner.start(
        {facingMode:"environment"},
        {fps:10, qrbox:{width:270,height:270}, aspectRatio:1.0},
        (decodedText)=>{
          const c=extractCredentials(decodedText);
          if(c) login(c);
          else {
            rawEl.style.display="block";
            rawEl.textContent=decodedText;
            status("تمت قراءة QR لكن لم أجد Username وPassword. النص المقروء ظاهر بالأسفل.");
          }
        },
        ()=>{}
      );
      status("الكاميرا تعمل. وجّهها إلى QR الكارت.");
    }catch(e){
      stop();
      status("تعذر تشغيل الكاميرا. تأكد من السماح بالكاميرا وأن الصفحة مفتوحة عبر HTTPS.");
    }
  }

  startBtn.addEventListener("click",start);
  stopBtn.addEventListener("click",()=>{busy=false;stop();status("تم إيقاف الكاميرا.");});
})();
</script>
</body>
</html>
